<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <!--
      FOUC-prevention: читаем тему из localStorage до рендера React.
      Если ничего нет — смотрим на системные настройки (prefers-color-scheme).
      Дефолт HTML уже data-theme="dark", поэтому при любом сбое остаёмся тёмными.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("aegis-theme");
          var theme =
            stored === "dark" || stored === "light"
              ? stored
              : window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.setAttribute("data-theme", theme);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", theme === "light" ? "#f5f5f5" : "#121212");
        } catch (_) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/icons.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&family=Noto+Color+Emoji&display=swap"
      rel="stylesheet"
    />
    <meta name="theme-color" content="#121212" />
    <meta name="description" content="Aegis — кроссплатформенный веб-мессенджер" />
    <title>Aegis</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
